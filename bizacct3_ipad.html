<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビジネス会計検定3級 問題演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --base:#eef1f4; --ink:#1d2733; --sub:#5b6775; --line:#cfd6de;
  --mark:#2b5daa; --mark-soft:#dfe8f6; --ok:#1e7a4e; --ok-soft:#e1f2e9; --ng:#b42318; --ng-soft:#fbe7e5;
  --on-mark:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18202a; --base:#10161d; --ink:#e6ebf0; --sub:#9aa6b3; --line:#2e3a47;
    --mark:#7ea6e6; --mark-soft:#22324a; --ok:#5cc495; --ok-soft:#173326; --ng:#f08077; --ng-soft:#3a1f1d; --on-mark:#0d1520;
  }
}
:root[data-theme="dark"]{
  --paper:#18202a; --base:#10161d; --ink:#e6ebf0; --sub:#9aa6b3; --line:#2e3a47;
  --mark:#7ea6e6; --mark-soft:#22324a; --ok:#5cc495; --ok-soft:#173326; --ng:#f08077; --ng-soft:#3a1f1d; --on-mark:#0d1520;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--base);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
.num,table{font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;min-height:60px}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:15px;color:var(--sub);white-space:nowrap}
.stat b{color:var(--ink)}
.progress{height:4px;background:var(--base)}
.progress i{display:block;height:100%;width:0;background:var(--mark);transition:width .25s}

.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:16px;font-weight:500;padding:9px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:focus-visible,.choice:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn.primary{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.big{font-size:18px;padding:12px 26px;min-height:54px}
.btn:disabled{opacity:.45;cursor:default}

main{max-width:1280px;margin:0 auto;padding:24px 20px 140px}
.narrow{max-width:820px;margin:0 auto}

/* home */
.hero{margin:12px 0 28px}
.hero h2{font-size:28px;line-height:1.35;margin:0 0 6px}
.hero p{margin:0;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{appearance:none;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:22px 22px 20px;cursor:pointer;display:grid;grid-template-columns:72px 1fr;gap:4px 18px;align-items:start}
.tile:active{transform:scale(.99)}
.tile .sym{grid-row:1 / span 3;width:72px;height:72px;border-radius:50%;border:2px solid var(--mark);color:var(--mark);
  display:grid;place-items:center;font-weight:700;font-size:26px;letter-spacing:-.02em}
.tile .tt{font-size:21px;font-weight:700}
.tile .td{color:var(--sub);font-size:15px;line-height:1.6}
.tile .tn{font-size:14px;color:var(--mark);font-weight:700;margin-top:4px}
.home-note{margin-top:22px;color:var(--sub);font-size:14px}
.home-note button{appearance:none;background:none;border:none;color:var(--mark);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}

/* setup */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;cursor:pointer;
  text-align:left;min-height:52px;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.chip small{color:var(--sub);font-size:13px}
.chip.on{background:var(--mark-soft);border-color:var(--mark)}
.chip.on b{color:var(--mark)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{appearance:none;border:none;background:var(--paper);padding:10px 18px;min-height:46px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--mark);color:var(--on-mark);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.startline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.startline .hint{color:var(--sub);font-size:15px}
.backlink{appearance:none;background:none;border:none;color:var(--mark);cursor:pointer;padding:6px 0;font-size:16px;margin-bottom:6px}
.setlist{display:flex;flex-direction:column;gap:12px}
.setbtn{appearance:none;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.setbtn b{display:block;font-size:18px}
.setbtn span{color:var(--sub);font-size:15px}

/* drill */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.qmeta{font-size:14px;color:var(--sub);margin-bottom:8px}
.qtext{font-size:19px;line-height:1.8;margin:0}
.stmt{margin:12px 0 0;padding:0;list-style:none}
.stmt li{display:flex;gap:10px;margin-bottom:8px;font-size:18px;line-height:1.75}
.stmt li b{flex:none}
.choices{margin:18px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.tf{max-width:480px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;appearance:none;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:58px;cursor:pointer}
.choices.tf .choice{justify-content:center;min-height:76px}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mark);display:grid;place-items:center;
  font-size:15px;font-weight:700;color:var(--mark)}
.tfmark{font-size:36px;font-weight:700;line-height:1;color:var(--mark)}
.tflab{font-size:15px;color:var(--sub)}
.choice.sel{background:var(--mark-soft);border-color:var(--mark)}
.choice.sel .bub{background:var(--mark);color:var(--on-mark)}
.choice:disabled{cursor:default;color:inherit}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bub{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.choice.right .tfmark,.choice.right .tflab{color:var(--ok)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.wrong .bub{border-color:var(--ng);background:var(--ng);color:var(--paper)}
.choice.wrong .tfmark,.choice.wrong .tflab{color:var(--ng)}
.fb{margin-top:18px;border-radius:12px;padding:14px 18px;background:var(--base)}
.fb .v{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin-bottom:4px}
.fb .v i{font-style:normal;font-size:30px;line-height:1}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:0}
.fb .ans{font-weight:700;margin-bottom:2px}

/* exam (総合) */
.cover{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:24px}
.cover h2{margin:0 0 6px;font-size:22px}
.cover p{margin:0;color:var(--sub)}
.sec-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.mat{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 170px);overflow:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mat summary{font-weight:700;cursor:pointer;list-style:none;min-height:32px}
.mat summary::-webkit-details-marker{display:none}
.mat summary::after{content:"（タップで閉じる）";font-weight:400;color:var(--sub);font-size:14px;margin-left:6px}
.mat:not([open]) summary::after{content:"（タップで開く）"}
.mat h3{font-size:16px;margin:14px 0 6px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
th{color:var(--sub);font-size:14px}
.v{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
tr.ind td:first-child{padding-left:22px}
.unit{font-size:13px;color:var(--sub);text-align:right;margin:0}
.qs{display:flex;flex-direction:column;gap:16px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.q.ok{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.q.ng{border-color:var(--ng);box-shadow:inset 5px 0 0 var(--ng)}
.q-top{display:flex;gap:12px;align-items:flex-start}
.qno{flex:none;font-weight:700;font-size:15px;color:var(--sub);padding-top:2px;min-width:3em}
.q-top p{flex:1;margin:0}
.verdict{flex:none;font-size:28px;line-height:1;font-weight:700}
.q.ok .verdict{color:var(--ok)} .q.ng .verdict{color:var(--ng)}
.q .choices{margin-top:12px}
.q .choices.tf .choice{min-height:60px}
.exp{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--base);font-size:16px}
.exp b{display:block;margin-bottom:2px}

/* result */
.result{background:var(--paper);border:2px solid var(--mark);border-radius:16px;padding:22px 24px;margin-bottom:22px}
.score{font-size:52px;font-weight:700;line-height:1}
.score small{font-size:19px;color:var(--sub);font-weight:500;margin-left:6px}
.result p{margin:10px 0 16px;color:var(--sub)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{background:var(--paper);border:1px solid var(--line);border-radius:12px}
.ritem summary{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;cursor:pointer;list-style:none}
.ritem summary::-webkit-details-marker{display:none}
.ritem .m{flex:none;font-size:22px;font-weight:700;line-height:1.2;width:24px;text-align:center}
.ritem.ok .m{color:var(--ok)} .ritem.ng .m{color:var(--ng)}
.ritem .st{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem[open] .st{-webkit-line-clamp:unset;display:block}
.ritem .rc{font-size:13px;color:var(--sub);flex:none;padding-top:3px}
.ritem .body{padding:0 16px 14px 52px}
.ritem .body .stmt li{font-size:16px}
.rhead{font-size:16px;margin:26px 0 10px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:1280px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:flex-end}
.dock .hint{flex:1;color:var(--sub);font-size:15px}
.dock:empty{display:none}

/* mock */
.tile.wide{width:100%;margin-bottom:16px;border-color:var(--mark);border-width:2px}
.tile.wide .sym{font-size:18px;background:var(--mark);color:var(--on-mark)}
.secnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.secnav .btn{text-decoration:none;display:inline-flex;align-items:center}
.msec{margin-bottom:36px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.msec-h{font-size:22px;margin:0 0 4px}
.msec-n{margin:0 0 14px;color:var(--sub);font-size:15px;max-width:90ch}
.box{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.8}
.box hr{border:none;border-top:1px dashed var(--line);margin:8px 0}
.choices.short{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.45);display:none;place-items:center;padding:20px}
.modal.show{display:grid}
.mbox{background:var(--paper);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox p{margin:0 0 18px;font-size:18px}
.mbox .acts{justify-content:flex-end}

/* calculator */
.calc{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;width:280px;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none}
.calc.show{display:block}
.calc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--sub);cursor:move;touch-action:none}
.calc-head button{appearance:none;border:none;background:none;color:var(--sub);font-size:22px;cursor:pointer;min-width:36px;min-height:36px}
.disp{background:var(--base);border-radius:10px;padding:8px 12px;text-align:right;margin-bottom:10px;min-height:68px}
.disp .ex{font-size:14px;color:var(--sub);min-height:20px;word-break:break-all}
.disp .cur{font-size:28px;font-weight:700;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{appearance:none;font-size:20px;min-height:48px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer;font-family:"BIZ UDPGothic",sans-serif}
.keys button.op{background:var(--mark-soft);color:var(--mark);font-weight:700}
.keys button.eq{background:var(--mark);color:var(--on-mark);border-color:var(--mark)}
.keys button:active{transform:scale(.96)}

@media (max-width:899px){
  .sec-body{display:block}
  .mat{position:static;max-height:none;margin-bottom:16px}
}
@media (max-width:640px){
  .tiles{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .choices.tf{grid-template-columns:1fr 1fr}
  .bar h1{font-size:15px}
  .stat.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar" id="bar"></div>
  <div class="progress"><i id="prog"></i></div>
</header>
<main id="main"></main>
<div class="dock" id="dock"></div>
<div class="modal" id="modal"></div>

<div class="calc" id="calc" role="dialog" aria-label="電卓">
  <div class="calc-head" id="calcHead"><span>電卓（ドラッグで移動）</span><button id="calcClose" aria-label="電卓を閉じる">×</button></div>
  <div class="disp"><div class="ex num" id="cEx"></div><div class="cur num" id="cCur">0</div></div>
  <div class="keys" id="keys"></div>
</div>

<script>
/* =========================================================
   問題データ
   ○×問題  TF[章] = [ [記述, 正しければ1/誤りなら0, 解説], ... ]
   正誤問題 SG[章] = [ [アの記述, 1/0, イの記述, 1/0, 解説], ... ]
   計算問題 CALC  = [ {ch:章, t:問題文, c:[選択肢], a:正解番号, e:解説}, ... ]
   総合問題 SOGO  = [ {title, note, material(HTML), qs:[{t,c,a,e}]} ]
   ========================================================= */
const CH = {1:"財務諸表とは",2:"貸借対照表の理解",3:"損益計算書の理解",4:"キャッシュ・フロー計算書の理解",5:"財務諸表分析の基本"};

const TF = {
1:[
["財務諸表の役割は、ステークホルダーに対して企業の実態を会計情報として提供することにある。",1,"ステークホルダー（利害関係者）がそれぞれの意思決定を正しく行えるよう、企業の状況を適切に表現することが求められます。"],
["ステークホルダーとは、企業の活動に利害がある人々のことで、利害関係者ともいう。",1,"経営者、投資者、株主、債権者、取引先、従業員、国・地方自治体、地域住民などが該当します。"],
["債権者が財務諸表から主に知りたいことは、どれだけのキャピタルゲインや配当が得られるかである。",0,"債権者の関心は「債権を無事に回収できるか」です。キャピタルゲインや配当に関心をもつのは投資者です。"],
["取引先が財務諸表から主に知りたいことは、経営者による経営が適切かどうかである。",0,"取引先の関心は「継続して取引ができるか」です。経営が適切かに関心をもつのは株主です。"],
["従業員は、賃金水準が適切かどうかに関心をもつ。",1,"ステークホルダーごとに知りたいことが異なる点をおさえましょう。"],
["企業の会計に関する制度としては、主に会社法と金融商品取引法があげられる。",1,"2つの法律では、中心的に対象としているステークホルダーが異なるため、財務諸表の体系や様式も異なります。"],
["会社法は、主に投資者の保護を目的としている。",0,"会社法の主な目的は株主・債権者の保護です。投資者の保護を目的とするのは金融商品取引法です。"],
["金融商品取引法は、主に投資者の保護を目的としている。",1,"投資者が自己責任原則のもとで投資行動ができるよう、情報の適正性を担保する監査制度などがあります。"],
["会社法では、財務諸表のことを計算書類と呼んでいる。",1,"「計算書類」という呼び方もあわせておさえておきましょう。"],
["会社法上の計算書類には、キャッシュ・フロー計算書が含まれる。",0,"会社法ではキャッシュ・フロー計算書の作成は求められていません。これが両制度の大きな相違点です。"],
["金融商品取引法上の財務諸表には、附属明細表が含まれる。",1,"キャッシュ・フロー計算書と附属明細表は、金融商品取引法上の財務諸表にのみ含まれます。"],
["株主資本等変動計算書は、会社法と金融商品取引法のいずれでも作成が求められる。",1,"貸借対照表、損益計算書、株主資本等変動計算書は両制度に共通です。"],
["個別注記表は、金融商品取引法上の財務諸表の1つである。",0,"個別注記表は会社法上の計算書類に含まれるものです。"],
["貸借対照表は、一定期間における企業の経営成績を示す。",0,"貸借対照表は「一定時点」の「財政状態」を示します。一定期間の経営成績を示すのは損益計算書です。"],
["損益計算書は、一定期間における企業の経営成績を示す。",1,"経営成績とは、企業が活動によってどれだけもうけたかを示すものです。"],
["キャッシュ・フロー計算書は、一定時点における現金等の残高のみを示す計算書である。",0,"キャッシュ・フロー計算書は「一定期間」の現金等の出入りを示します。"],
["貸借対照表が対象とする一定時点とは、通常、決算日の時点をいう。",1,"一会計期間の期末＝一定時点、と理解しておきましょう。"],
["損益計算書が対象とする一定期間とは、通常、決算日までの1年間をいう。",1,"財務諸表が報告の対象とする期間を会計期間といいます。"],

  id:`tf-${ch}-${i+1}`, kind:"tf", ch:+ch, no:i+1, text:r[0], choices:["○","×"], answer:r[1]?1:2, exp:r[2]})));
Object.keys(SG).forEach(ch=>SG[ch].forEach((r,i)=>{
  const a=!!r[1], b=!!r[3];
  POOL.sg.push({id:`sg-${ch}-${i+1}`, kind:"sg", ch:+ch, no:i+1,
    text:"次の記述の正誤の組み合わせとして、正しいものを選びなさい。",
    stmts:[["ア",r[0]],["イ",r[2]]], choices:SG_CHOICES,
    answer: a&&b?1 : a&&!b?2 : !a&&b?3 : 4,
    exp:`ア：${a?"正":"誤"}　イ：${b?"正":"誤"}。${r[4]}`});
}));
CALC.forEach((r,i)=>POOL.calc.push({id:`calc-${i+1}`, kind:"mc", ch:r.ch, no:i+1, text:r.t, choices:r.c, answer:r.a, exp:r.e}));

}

/* ===================== 一覧形式（○×・正誤）：全問解答→採点 ===================== */
const SHEET_NOTE = {
  tf:"次の記述が正しければ○、誤っていれば×を選びなさい。すべて解答したら「採点する」を押してください。",
  sg:"各問のア・イの記述について、正誤の組み合わせとして正しいものを選びなさい。すべて解答したら「採点する」を押してください。"
};
function sheetBar(){
  const Z=S.quiz, n=Z.list.filter(q=>Z.answers[q.id]!==undefined).length;
  setBar(`<button class="btn" data-act="quit">やめる</button><h1>${Z.label}</h1>
    <span class="stat">解答 <b class="num">${n}</b> / <span class="num">${Z.list.length}</span></span>${calcBtn}`, n/Z.list.length*100);
  setDock(Z.graded?"":`<span class="hint">${n<Z.list.length?`未解答があと ${Z.list.length-n} 問あります（このまま採点もできます）。`:"すべて解答しました。「採点する」を押してください。"}</span>
    <button class="btn primary big" data-act="gradesheet">採点する</button>`);
}
function renderSheet(){
  S.screen="sheet";
  const Z=S.quiz;
  let html=`<div class="narrow">`;
  if(Z.graded){
    const wrong=Z.list.filter(q=>Z.answers[q.id]!==q.answer);
    const ok=Z.list.length-wrong.length, pct=Math.round(ok/Z.list.length*100);
    html+=`<section class="result">
      <div class="score num">${ok}<small>/ ${Z.list.length}問 正解（${pct}%）</small></div>
      <p>${wrong.length===0?"全問正解です。":"各問の下に正解と解説を表示しています。まちがえた問題は記録されるので、あとから復習できます。"}</p>
      <div class="acts">
        ${wrong.length?`<button class="btn primary" data-act="retrywrong">まちがえた${wrong.length}問をもう一度</button>`:""}
        <button class="btn" data-act="again">同じ問題をもう一度</button>
        <button class="btn" data-act="setup">出題設定に戻る</button>
        <button class="btn" data-act="home">トップに戻る</button>
      </div></section>`;
  } else {
    html+=`<section class="cover"><h2>${Z.label}（${Z.list.length}問）</h2><p>${SHEET_NOTE[Z.mode]}</p></section>`;
  }
  html+=`<div class="qs">`;
  Z.list.forEach((q,i)=>{
    const a=Z.answers[q.id], done=Z.graded, ok=a===q.answer;
    html+=`<article class="q ${done?(ok?"ok":"ng"):""}" id="q-${q.id}">
      <div class="q-top"><span class="qno">問${i+1}</span>
        <div style="flex:1"><div class="qmeta" style="margin:0 0 2px">第${q.ch}章 ${CH[q.ch]}</div>
        ${q.kind==="tf"?`<p style="margin:0">${q.text}</p>`:stmtsHTML(q).replace('class="stmt"','class="stmt" style="margin-top:0"')}</div>
        ${done?`<span class="verdict">${ok?"○":"×"}</span>`:""}</div>
      ${choicesHTML(q,a,done)}
      ${done?`<div class="exp"><b>正解 ${ansLabel(q,q.answer)}${a===undefined?"（未解答）":(ok?"":`（あなたの解答 ${ansLabel(q,a)}）`)}</b>${q.exp}</div>`:""}
    </article>`;
  });
  html+=`</div></div>`;
  $("main").innerHTML=html;
  sheetBar();
}
function pickSheet(btn){
  const Z=S.quiz; if(Z.graded) return;
  const id=btn.dataset.q, n=+btn.dataset.n;
  Z.answers[id]=n;
  btn.parentElement.querySelectorAll(".choice").forEach(c=>{
    const on=+c.dataset.n===n; c.classList.toggle("sel",on); c.setAttribute("aria-checked",on);
  });
  sheetBar();
}
function gradeSheet(){
  const Z=S.quiz;
  Z.graded=true;
  Z.list.forEach(q=>markResult(Z.mode,q.id,Z.answers[q.id]===q.answer));
  renderSheet(); scrollTo({top:0,behavior:"smooth"});
}
function startFromSetup(){
  const mode=S.mode, st=S.setup[mode];
  let list=poolFor(mode);
  if(st.order==="rand") list=shuffle(list);
  if(st.count!=="all") list=list.slice(0,+st.count);
  startQuiz(mode,list,MODES[mode].name);
}
function startReview(){
  const ids=new Set(WRONG[S.mode]||[]);
  const list=POOL[S.mode].filter(q=>ids.has(q.id));
  if(list.length) startQuiz(S.mode,list,MODES[S.mode].name+"（復習）");
}
function choicesHTML(q, a, done){
  const tf=q.kind==="tf";
  const short = !tf && q.choices.every(c=>String(c).length<=6);
  return `<div class="choices ${tf?"tf":""} ${short?"short":""}" role="radiogroup">${q.choices.map((c,ci)=>{
    const n=ci+1;
    let cls = a===n?"sel":"";
    if(done) cls = n===q.answer?"right":(a===n?"wrong":"");
    const inner = tf ? `<span class="tfmark">${c}</span><span class="tflab">${n===1?"正しい":"誤り"}</span>`
                     : `<span class="bub num">${n}</span><span class="num">${c}</span>`;
    return `<button class="choice ${cls}" role="radio" aria-checked="${a===n}" data-act="pick" data-q="${q.id}" data-n="${n}" ${done?"disabled":""}>${inner}</button>`;
  }).join("")}</div>`;
}
const ansLabel = (q,n) => q.kind==="tf" ? q.choices[n-1] : (q.kind==="sg" ? `${circ(n)} ${q.choices[n-1]}` : `${circ(n)} ${q.choices[n-1]}`);
function stmtsHTML(q){ return q.stmts?`<ul class="stmt">${q.stmts.map(([k,t])=>`<li><b>${k}</b><span>${t}</span></li>`).join("")}</ul>`:""; }

function renderDrill(){
  S.screen="drill";
  const Z=S.quiz, q=Z.list[Z.idx], a=Z.answers[q.id], done=a!==undefined;
  const correct=Object.entries(Z.answers).filter(([id,v])=>Z.list.find(x=>x.id===id).answer===v).length;
  setBar(`<button class="btn" data-act="quit">やめる</button><h1>${Z.label}</h1>
    <span class="stat"><b class="num">${Z.idx+1}</b> / <span class="num">${Z.list.length}</span></span>
    <span class="stat hide-sm">正解 <b class="num">${correct}</b></span>${calcBtn}`,
    (Object.keys(Z.answers).length)/Z.list.length*100);
  const ok = done && a===q.answer;
  $("main").innerHTML = `<div class="narrow"><article class="qcard">
    <div class="qmeta">第${q.ch}章 ${CH[q.ch]}</div>
    <p class="qtext">${q.text}</p>
    ${stmtsHTML(q)}
    ${choicesHTML(q,a,done)}
    ${done?`<div class="fb ${ok?"ok":"ng"}" id="fb">
      <div class="v"><i>${ok?"○":"×"}</i>${ok?"正解":"不正解"}</div>
      <p class="ans">正解：${ansLabel(q,q.answer)}</p><p>${q.exp}</p></div>`:""}
  </article></div>`;
  const last = Z.idx===Z.list.length-1;
  setDock(done ? `<span class="hint">${last?"これで最後の問題です。":""}</span><button class="btn primary big" data-act="next">${last?"結果を見る":"次の問題へ"}</button>`
               : `<span class="hint">選択肢をタップして解答してください。</span>`);
  if(done){ const fb=$("fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"}); }
}
function pick(id,n){
  const Z=S.quiz; if(Z.answers[id]!==undefined) return;
  Z.answers[id]=n;
  const q=Z.list.find(x=>x.id===id);
  markResult(Z.mode,id,q.answer===n);
  renderDrill();
}
function next(){
  const Z=S.quiz;
  if(Z.idx<Z.list.length-1){ Z.idx++; renderDrill(); scrollTo({top:0}); }
  else renderResult();
}

function resultItem(q,a){
  const ok=a===q.answer;
  return `<details class="ritem ${ok?"ok":"ng"}"><summary><span class="m">${ok?"○":"×"}</span>
    <span class="st">${q.stmts?q.stmts.map(([k,t])=>k+"："+t).join("　"):q.text}</span>
    <span class="rc">${q.ch?`第${q.ch}章`:`問${q.no}`}</span></summary>
    <div class="body">${q.stmts?`<p style="margin:0">${q.text}</p>`+stmtsHTML(q):(q.kind==="tf"?"":`<p style="margin:0">${q.text}</p>`)}
      <div class="exp"><b>正解 ${ansLabel(q,q.answer)}${a===undefined?"（未解答）":(ok?"":`（あなたの解答 ${ansLabel(q,a)}）`)}</b>${q.exp}</div></div></details>`;
}
function renderResult(){
  S.screen="result";
  const Z=S.quiz;
  const wrong=Z.list.filter(q=>Z.answers[q.id]!==q.answer);
  const ok=Z.list.length-wrong.length;
  const pct=Math.round(ok/Z.list.length*100);
  setBar(`<h1>${Z.label}の結果</h1>`,100);
  $("main").innerHTML = `<div class="narrow">
    <section class="result">
      <div class="score num">${ok}<small>/ ${Z.list.length}問 正解（${pct}%）</small></div>
      <p>${wrong.length===0?"全問正解です。":"×の問題をタップすると解説を確認できます。まちがえた問題は記録されるので、あとから復習できます。"}</p>
      <div class="acts">
        ${wrong.length?`<button class="btn primary" data-act="retrywrong">まちがえた${wrong.length}問をもう一度</button>`:""}
        <button class="btn" data-act="again">同じ問題をもう一度</button>
        <button class="btn" data-act="setup">出題設定に戻る</button>
        <button class="btn" data-act="home">トップに戻る</button>
      </div>
    </section>
    ${wrong.length?`<h3 class="rhead">まちがえた問題</h3><div class="rlist">${wrong.map(q=>resultItem(q,Z.answers[q.id])).join("")}</div>`:""}
    <h3 class="rhead">すべての問題</h3>
    <div class="rlist">${Z.list.map(q=>resultItem(q,Z.answers[q.id])).join("")}</div>
  </div>`;
  setDock("");
  scrollTo({top:0});
}

/* ===================== 総合問題 ===================== */
function renderSogoList(){
  $("main").innerHTML = `<div class="narrow">
    <button class="backlink" data-act="home">‹ トップに戻る</button>
    <div class="setlist">${SOGO.map((s,i)=>{
      const wc=(WRONG.sogo||[]).filter(id=>id.startsWith(`sogo-${i+1}-`)).length;
      return `<button class="setbtn" data-act="exam" data-i="${i}"><b>${s.title}</b>
        <span>全${s.qs.length}問${wc?`　前回まちがえた問題 ${wc}問`:""}</span></button>`;}).join("")}</div>

function startExam(i){ S.exam={i, answers:{}, graded:false, kept:{}}; renderExam(); scrollTo({top:0}); }
function renderExam(){
  S.screen="exam";
  const E=S.exam, s=SOGO[E.i];
  const n=s.qs.filter(q=>E.answers[q.id]!==undefined).length;
  setBar(`<button class="btn" data-act="quit">やめる</button><h1>${s.title}</h1>
    <span class="stat">解答 <b class="num">${n}</b> / <span class="num">${s.qs.length}</span></span>${calcBtn}`, n/s.qs.length*100);

    const ok=s.qs.filter(q=>E.answers[q.id]===q.answer).length, wrong=s.qs.length-ok;
    html+=`<section class="result"><div class="score num">${ok}<small>/ ${s.qs.length}問 正解</small></div>
      <p>${wrong===0?"全問正解です。":"×の問題は解説を読んでから、もう一度解いてみましょう。"}</p>
      <div class="acts">${wrong?`<button class="btn primary" data-act="examretry">まちがえた問題を解き直す</button>`:""}
        <button class="btn" data-act="examreset">最初から解き直す</button>
        <button class="btn" data-act="mode" data-mode="sogo">総合問題の一覧へ</button></div></section>`;
  } else {
    html+=`<section class="cover"><h2>${s.title}</h2><p>${s.note}</p></section>`;
  }
  html+=`<div class="sec-body"><details class="mat" open><summary>資料</summary>${s.material}</details><div class="qs">`;
  s.qs.forEach(q=>{
    const a=E.answers[q.id], done=E.graded||E.kept[q.id];
    const cls=done?(a===q.answer?"ok":"ng"):"";
    html+=`<article class="q ${cls}" id="q-${q.id}"><div class="q-top"><span class="qno">問${q.no}</span><p>${q.text}</p>
      ${done?`<span class="verdict">${a===q.answer?"○":"×"}</span>`:""}</div>
      ${choicesHTML(q,a,done)}
      ${done?`<div class="exp"><b>正解 ${circ(q.answer)}${a===undefined?"（未解答）":(a!==q.answer?`（あなたの解答 ${circ(a)}）`:"")}</b>${q.exp}</div>`:""}</article>`;
  });
  html+=`</div></div>`;
  $("main").innerHTML=html;
  setDock(E.graded?"":`<span class="hint">${n<s.qs.length?`未解答があと ${s.qs.length-n} 問あります（このまま採点もできます）。`:"すべて解答しました。"}</span>
    <button class="btn primary big" data-act="grade">採点する</button>`);
}

/* ===================== 模擬試験 ===================== */
const MKEY = id => "bizacct3:mock:"+id;
function loadMock(id){ try{ return JSON.parse(localStorage.getItem(MKEY(id))); }catch(e){ return null; } }
function saveMock(){ try{ localStorage.setItem(MKEY(S.mock.m.id), JSON.stringify({answers:S.mock.answers, start:S.mock.start, graded:S.mock.graded, used:S.mock.used})); }catch(e){} }
function clearMock(id){ try{ localStorage.removeItem(MKEY(id)); }catch(e){} }

function renderMockList(){
  S.screen="mocklist";
  setBar(`<h1>模擬試験</h1>`);
  $("main").innerHTML = `<div class="narrow">
    <button class="backlink" data-act="home">‹ トップに戻る</button>
    <div class="panel"><h3>試験の形式</h3>
      <p style="margin:0;color:var(--sub)">第1問 正誤問題／第2問 知識・計算問題／第3問 1社の2期分析／第4問 2社の比較分析。全50問・1問2点・100点満点で、70点以上が合格ラインです。解答は端末に自動保存されるので、途中で閉じても続きから解けます。</p></div>
    <div class="setlist">${MOCK.map((m,i)=>{
      const sv=loadMock(m.id);
      const n=sv?Object.keys(sv.answers||{}).length:0;
      const st = !sv ? "未受験" : sv.graded ? `採点済み（${MOCK_QS(m).filter(q=>sv.answers[q.id]===q.answer).length*2}点）` : `解答途中（${n}/${m.total}問）`;
      return `<div class="panel" style="margin:0">
        <h3 style="margin-bottom:4px">${m.title}</h3><p style="margin:0 0 12px;color:var(--sub)">全${m.total}問・制限時間${m.minutes}分　${st}</p>
        <div class="row">${sv?`<button class="btn primary" data-act="mockgo" data-i="${i}">${sv.graded?"結果を見る":"続きから解く"}</button><button class="btn" data-act="mocknew" data-i="${i}">最初から解く</button>`
          :`<button class="btn primary big" data-act="mocknew" data-i="${i}">試験をはじめる</button>`}</div></div>`;}).join("")}</div>
  </div>`;
  setDock(""); scrollTo({top:0});
}
function startMock(i, fresh){
  const m=MOCK[i];
  if(fresh) clearMock(m.id);
  const sv=loadMock(m.id);
  S.mock={i, m, answers:sv?sv.answers:{}, start:sv?sv.start:Date.now(), graded:sv?sv.graded:false, used:sv?sv.used:0};
  saveMock(); renderMock(); scrollTo({top:0});
}
function fmtTime(ms){ const neg=ms<0; ms=Math.abs(ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (neg?"超過 ":"")+(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }
function mockBar(){
  const M=S.mock, n=Object.keys(M.answers).length;
  setBar(`<button class="btn" data-act="mockquit">やめる</button><h1>${M.m.title}</h1>
    ${M.graded?"":`<span class="stat">残り <b class="num" id="mtimer"></b></span>`}
    <span class="stat hide-sm">解答 <b class="num">${n}</b> / <span class="num">${M.m.total}</span></span>${calcBtn}`, n/M.m.total*100);
  setDock(M.graded?"":`<span class="hint">${n<M.m.total?`未解答があと ${M.m.total-n} 問あります（このまま採点もできます）。`:"すべて解答しました。"}</span>
    <button class="btn primary big" data-act="mockgrade">採点する</button>`);
  tickMock();
}
function tickMock(){
  const el=$("mtimer"); if(!el||!S.mock||S.mock.graded) return;
  const left=S.mock.m.minutes*60000-(Date.now()-S.mock.start);
  el.textContent=fmtTime(left); el.style.color = left<0?"var(--ng)":(left<600000?"var(--ng)":"");
}
setInterval(()=>{ if(S.screen==="mock") tickMock(); },1000);

function renderMock(){
  S.screen="mock";
  const M=S.mock, m=M.m, all=MOCK_QS(m);
  let html="";
  if(M.graded){
    const ok=all.filter(q=>M.answers[q.id]===q.answer).length, score=ok*2, pass=score>=70;
    html+=`<section class="result">
      <div class="score num">${score}<small>点 / 100点</small></div>
      <p style="margin:8px 0 4px;font-weight:700;color:${pass?"var(--ok)":"var(--ng)"}">${pass?"合格ライン（70点）に達しています。":`合格ライン（70点）まで、あと${70-score}点です。`}</p>
      <p style="margin:0 0 12px">解答時間 ${fmtTime(M.used).replace("超過 ","")}　正解 ${ok} / ${m.total}問。各問の下に正解と解説を表示しています。</p>
      <div class="tblwrap" style="margin-bottom:16px"><table>
        <tr><th>大問</th><th class="v">正解数</th><th class="v">得点</th></tr>
        ${m.secs.map(sec=>{const k=sec.qs.filter(q=>M.answers[q.id]===q.answer).length;
          return `<tr><td>${sec.title}</td><td class="v">${k} / ${sec.qs.length}</td><td class="v">${k*2} / ${sec.qs.length*2}点</td></tr>`}).join("")}
      </table></div>
      <div class="acts"><button class="btn primary" data-act="mocknew" data-i="${M.i}">最初から解き直す</button>
        <button class="btn" data-act="mocklist">模擬試験の一覧へ</button><button class="btn" data-act="home">トップに戻る</button></div></section>`;
  } else {
    html+=`<section class="cover"><h2>${m.title}</h2><p>全${m.total}問・制限時間${m.minutes}分。解答は自動保存されます。時間を過ぎても解答・採点はできます。</p></section>`;
  }
  html+=`<nav class="secnav">${m.secs.map((sec,si)=>`<a class="btn" href="#sec-${si}">${sec.title}</a>`).join("")}</nav>`;
  m.secs.forEach((sec,si)=>{
    html+=`<section class="msec" id="sec-${si}"><h2 class="msec-h">${sec.title}</h2><p class="msec-n">${sec.note}</p>
      <div class="${sec.material?"sec-body":"narrow"}">${sec.material?`<details class="mat" open><summary>資料</summary>${sec.material}</details>`:""}<div class="qs">`;
    sec.qs.forEach(q=>{
      const a=M.answers[q.id], done=M.graded, ok=a===q.answer;
      html+=`<article class="q ${done?(ok?"ok":"ng"):""}" id="q-${q.id}"><div class="q-top"><span class="qno">問${q.no}</span><p>${q.text}</p>
        ${done?`<span class="verdict">${ok?"○":"×"}</span>`:""}</div>
        ${q.box?`<div class="box">${q.box}</div>`:""}
        ${choicesHTML(q,a,done)}
        ${done?`<div class="exp"><b>正解 ${circ(q.answer)}${a===undefined?"（未解答）":(ok?"":`（あなたの解答 ${circ(a)}）`)}</b>${q.exp}</div>`:""}</article>`;
    });
    html+=`</div></div></section>`;
  });
  $("main").innerHTML=html;
  mockBar();
}
function pickMock(btn){
  const M=S.mock; if(M.graded) return;
  const n=+btn.dataset.n; M.answers[btn.dataset.q]=n; saveMock();
  btn.parentElement.querySelectorAll(".choice").forEach(c=>{ const on=+c.dataset.n===n; c.classList.toggle("sel",on); c.setAttribute("aria-checked",on); });
  mockBar();
}
function gradeMock(){
  const M=S.mock; M.graded=true; M.used=Date.now()-M.start;
  MOCK_QS(M.m).forEach(q=>markResult("mock",q.id,M.answers[q.id]===q.answer));
  saveMock(); renderMock(); scrollTo({top:0,behavior:"smooth"});
}

/* ===================== イベント ===================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(act==="home") renderHome();
  else if(act==="mode"){ renderSetup(b.dataset.mode); scrollTo({top:0}); }
  else if(act==="setup"){ renderSetup(S.quiz.mode); scrollTo({top:0}); }
  else if(act==="ch"){ const st=S.setup[S.mode], c=+b.dataset.ch;
    st.chs = st.chs.includes(c)?st.chs.filter(x=>x!==c):[...st.chs,c].sort(); renderSetup(S.mode); }
  else if(act==="chall"){ S.setup[S.mode].chs=[1,2,3,4,5]; renderSetup(S.mode); }
  else if(act==="chnone"){ S.setup[S.mode].chs=[]; renderSetup(S.mode); }
  else if(act==="order"){ S.setup[S.mode].order=b.dataset.v; renderSetup(S.mode); }
  else if(act==="count"){ S.setup[S.mode].count=b.dataset.v; renderSetup(S.mode); }
  else if(act==="start") startFromSetup();
  else if(act==="review") startReview();
  else if(act==="pick"){
    if(S.screen==="drill") pick(b.dataset.q,+b.dataset.n);
    else if(S.screen==="sheet") pickSheet(b);
    else if(S.screen==="mock") pickMock(b);
    else if(S.screen==="exam"){ S.exam.answers[b.dataset.q]=+b.dataset.n; renderExam(); }
  }
  else if(act==="next") next();
  else if(act==="gradesheet") gradeSheet();
  else if(act==="mocklist") renderMockList();
  else if(act==="mockgo") startMock(+b.dataset.i,false);
  else if(act==="mocknew"){ const i=+b.dataset.i; if(loadMock(MOCK[i].id)) askConfirm("これまでの解答を消して、最初から解きますか？","最初から解く",()=>startMock(i,true)); else startMock(i,true); }
  else if(act==="mockgrade") gradeMock();
  else if(act==="mockquit"){ if(S.mock.graded){ renderMockList(); } else askConfirm("試験を中断して一覧に戻りますか？解答は保存され、続きから再開できます。","中断する",()=>{ $("calc").classList.remove("show"); renderMockList(); }); }
  else if(act==="quit"){ askConfirm("途中でやめてトップに戻りますか？","やめる",()=>{ $("calc").classList.remove("show"); renderHome(); }); }
  else if(act==="retrywrong"){ const Z=S.quiz; startQuiz(Z.mode, Z.list.filter(q=>Z.answers[q.id]!==q.answer), MODES[Z.mode].name+"（解き直し）"); }
  else if(act==="again"){ const Z=S.quiz; startQuiz(Z.mode, Z.list, Z.label); }
  else if(act==="calc") $("calc").classList.toggle("show");
  else if(act==="clearwrong"){ askConfirm("まちがえた問題の記録をすべて消しますか？","記録を消す",()=>{ WRONG={}; saveWrong(); renderHome(); }); }
  else if(act==="exam") startExam(+b.dataset.i);
  else if(act==="grade"){
    const E=S.exam, s=SOGO[E.i];
    E.graded=true; s.qs.forEach(q=>markResult("sogo",q.id,E.answers[q.id]===q.answer));
    renderExam(); scrollTo({top:0,behavior:"smooth"});
  }
  else if(act==="examretry"){
    const E=S.exam, s=SOGO[E.i]; E.kept={};
    s.qs.forEach(q=>{ if(E.answers[q.id]===q.answer) E.kept[q.id]=true; else delete E.answers[q.id]; });
    E.graded=false; renderExam();
    const f=s.qs.find(q=>!E.kept[q.id]); if(f) $("q-"+f.id).scrollIntoView({behavior:"smooth",block:"center"});
  }
  else if(act==="examreset"){ startExam(S.exam.i); }
});

/* ===================== 確認ダイアログ（画面内） ===================== */
function askConfirm(msg, okLabel, onYes){
  const m=$("modal");
  m.innerHTML=`<div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="mmsg">
    <p id="mmsg">${msg}</p>
    <div class="acts"><button class="btn" id="mNo">続ける</button><button class="btn primary" id="mYes">${okLabel}</button></div></div>`;
  m.classList.add("show");
  const close=()=>{ m.classList.remove("show"); m.innerHTML=""; };
  $("mNo").onclick=close;
  $("mYes").onclick=()=>{ close(); onYes(); };
  m.onclick=e=>{ if(e.target===m) close(); };
  $("mYes").focus();
}

/* ===================== 電卓 ===================== */
const calc=$("calc");
$("calcClose").onclick=()=>calc.classList.remove("show");
const KEYS=["C","←","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0","00",".","="];
KEYS.forEach(k=>{const b=document.createElement("button");b.textContent=k;
  if("÷×−+%".includes(k)) b.className="op"; if(k==="=") b.className="eq"; b.dataset.k=k; $("keys").appendChild(b);});
let expr="",cur="0",fresh=true,lastEx="";
function fmt(v){ if(v==="エラー") return v; const [i,d]=String(v).split("."); const n=Number(i); return (isNaN(n)?i:n.toLocaleString("ja-JP"))+(d!==undefined?"."+d:""); }
function showC(){ $("cEx").textContent=expr||lastEx; $("cCur").textContent=fmt(cur); }
function evalExpr(s){ const t=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  if(!/^[0-9+\-*/. ]+$/.test(t)) return NaN; try{ return Function('"use strict";return ('+t+')')(); }catch(e){ return NaN; } }
function clean(n){ return isFinite(n)?String(Math.round(n*1e10)/1e10):"エラー"; }
$("keys").addEventListener("click",e=>{
  const k=e.target.dataset.k; if(!k) return;
  if(k==="C"){expr="";cur="0";fresh=true;lastEx="";}
  else if(k==="←"){ cur=cur.length>1?cur.slice(0,-1):"0"; }
  else if(/^[0-9]+$/.test(k)){ cur=(fresh||cur==="0"||cur==="エラー")?(k==="00"?"0":k):cur+k; fresh=false; }
  else if(k==="."){ if(fresh){cur="0.";fresh=false;} else if(!cur.includes(".")) cur+="."; }
  else if(k==="%"){ cur=clean(parseFloat(cur)*100); fresh=true; }
  else if("÷×−+".includes(k)){
    if(fresh && expr){ expr=expr.slice(0,-2)+k+" "; }
    else { expr+=cur+" "+k+" "; cur=clean(evalExpr(expr.slice(0,-3))); }
    fresh=true; lastEx="";
  }
  else if(k==="="){ if(expr){ const r=evalExpr(expr+cur); lastEx=expr+cur+" ="; cur=clean(r); expr=""; fresh=true; } }
  showC();
});
showC();
(function(){
  const h=$("calcHead"); let sx,sy,ox,oy,drag=false;
  h.addEventListener("pointerdown",e=>{ if(e.target.tagName==="BUTTON")return; drag=true; h.setPointerCapture(e.pointerId);
    const r=calc.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top; });
  h.addEventListener("pointermove",e=>{ if(!drag)return;
    calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,ox+e.clientX-sx))+"px";
    calc.style.top=Math.max(0,Math.min(innerHeight-calc.offsetHeight,oy+e.clientY-sy))+"px";
    calc.style.right="auto"; calc.style.bottom="auto"; });
  h.addEventListener("pointerup",()=>drag=false);
})();

renderHome();
</script>
